# DuckGraphLake configuration for this solution. scripts/run-lake.sh starts the
# server with it, from inside data/ (see init.sql for why the working directory
# matters). Relative paths in this file are relative to this file.
#
# Everything not set here keeps the server's default; `duckgraphlake help config`
# prints the complete file.

# DuckDB's default memory limit is 80% of RAM, more than is free beside the two
# Mendix runtimes and PostgreSQL: a statement that outgrew what was free got the
# process killed instead of spilling to disk. replay.forecast is shaped to
# stream (init.sql), and this cap keeps the next heavy statement honest. It has
# to be set here: SET in init.sql works at start-up but is refused when the file
# is re-run on a live server, which locks its configuration.
[duckdb]
memory_limit = "4GB"
# Fewer threads, less memory held at once: replay.forecast ran out of the 4 GB
# on all ten while other steps refreshed beside it (FINDINGS §125).
threads = 4

[data]
directory = "../data"
# Discovery stays on: CDC and telemetry views depend on the server's own
# bookkeeping, and the views it makes over data/f1db (one 151-column union,
# ako/DuckGraphLake#31) are harmless next to the f1.* views init.sql defines.
init_sql = "init.sql"

[rdf]
# The graph over the f1 views: SPARQL, the catalog and OData's entity sets
# (Driver, Constructor, Race). Both reload when they change.
mapping = "mapping/*.ttl"
ontology = "ontology/*.ttl"
# f1db ids are unique and non-null; saying so lets SPARQL skip the checks. The
# result tables are unique on (race, display order), as their IRIs are.
unique_keys = """f1.drivers(id); f1.constructors(id); f1.races(id); f1.circuits(id); f1.circuit_layouts(id); f1.countries(id); f1.continents(id); f1.grands_prix(id); f1.engine_manufacturers(id); f1.tyre_manufacturers(id); f1.engines(id); f1.chassis(id); f1.entrants(id); f1.seasons(year); f1.race_results(raceId, positionDisplayOrder); f1.sprint_results(raceId, positionDisplayOrder); f1.qualifying_results(raceId, positionDisplayOrder); f1.qualifying_1_results(raceId, positionDisplayOrder); f1.qualifying_2_results(raceId, positionDisplayOrder); f1.pre_qualifying_results(raceId, positionDisplayOrder); f1.sprint_qualifying_results(raceId, positionDisplayOrder); f1.fp1_results(raceId, positionDisplayOrder); f1.fp2_results(raceId, positionDisplayOrder); f1.fp3_results(raceId, positionDisplayOrder); f1.fp4_results(raceId, positionDisplayOrder); f1.warming_up_results(raceId, positionDisplayOrder); f1.starting_grid(raceId, positionDisplayOrder); f1.sprint_starting_grid(raceId, positionDisplayOrder); f1.fastest_laps(raceId, positionDisplayOrder); f1.pit_stops(raceId, positionDisplayOrder); f1.driver_of_the_day(raceId, positionDisplayOrder); f1.race_driver_standings(raceId, positionDisplayOrder); f1.race_constructor_standings(raceId, positionDisplayOrder); f1.season_driver_standings(year, positionDisplayOrder); f1.season_constructor_standings(year, positionDisplayOrder)"""

# gold.* is what the frontend reads: keep the results, and recompute a view
# when a file it reads changes (a refreshed f1db release, for instance).
[[materialize]]
views = "gold.*"
refresh = "on_change"

# replay.* is for races that have finished, and the OpenF1 topic under it
# changes every minute during a session: recompute on a timer, not on change.
# The season's forecast takes about half a minute; once an hour is plenty for
# races already run (refresh one by hand: POST /api/steps/<name>/refresh).
# The live session's newest OpenF1 responses, which the Timing page reads every
# five seconds: ten seconds old at most, one scan of the topic per refresh.
[[materialize]]
views = "live.payloads"
refresh = "every 10s"

[[materialize]]
views = "replay.*"
refresh = "every 1h"


[mcp]
# The MCP endpoint is for agents, the frontend's chat agent included, and an
# agent gets every tool a server offers. With changes allowed that includes
# produce and publish_event (writing to Kafka topics, the CDC ones too),
# define_view, set_mapping and set_dashboard. Off: agents read, and the repo
# (lake/init.sql, lake/mapping, lake/dashboards over HTTP) is how the lake
# changes.
allow_changes = false
