# DuckGraphLake configuration for this solution. scripts/run-lake.sh starts the
# server with it, from inside data/ (see init.sql for why the working directory
# matters). Relative paths in this file are relative to this file.
#
# Everything not set here keeps the server's default; `duckgraphlake help config`
# prints the complete file.

# DuckDB's default memory limit is 80% of RAM, more than is free beside the two
# Mendix runtimes and PostgreSQL: a statement that outgrew what was free got the
# process killed instead of spilling to disk. replay.forecast is shaped to
# stream (init.sql), and this cap keeps the next heavy statement honest. It has
# to be set here: SET in init.sql works at start-up but is refused when the file
# is re-run on a live server, which locks its configuration.
[duckdb]
memory_limit = "4GB"

[data]
directory = "../data"
# Discovery stays on: CDC and telemetry views depend on the server's own
# bookkeeping, and the views it makes over data/f1db (one 151-column union,
# ako/DuckGraphLake#31) are harmless next to the f1.* views init.sql defines.
init_sql = "init.sql"

[rdf]
# The graph over the f1 views: SPARQL, the catalog and OData's entity sets
# (Driver, Constructor, Race). Both reload when they change.
mapping = "mapping/*.ttl"
ontology = "ontology/*.ttl"
# f1db ids are unique and non-null; saying so lets SPARQL skip the checks.
unique_keys = "f1.drivers(id); f1.constructors(id)"

# gold.* is what the frontend reads: keep the results, and recompute a view
# when a file it reads changes (a refreshed f1db release, for instance).
[[materialize]]
views = "gold.*"
refresh = "on_change"

# replay.* is for races that have finished, and the OpenF1 topic under it
# changes every minute during a session: recompute on a timer, not on change.
# The season's forecast takes about half a minute; once an hour is plenty for
# races already run (refresh one by hand: POST /api/steps/<name>/refresh).
[[materialize]]
views = "replay.*"
refresh = "every 1h"

[mcp]
# The MCP endpoint is for agents, the frontend's chat agent included, and an
# agent gets every tool a server offers. With changes allowed that includes
# produce and publish_event (writing to Kafka topics, the CDC ones too),
# define_view, set_mapping and set_dashboard. Off: agents read, and the repo
# (lake/init.sql, lake/mapping, lake/dashboards over HTTP) is how the lake
# changes.
allow_changes = false
